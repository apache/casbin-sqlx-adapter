[package]
name = "sqlx-adapter"
version = "1.9.0"
authors = [
	"Eason Chai <hackerchai.com@gmail.com>",
	"Cheng JIANG <jiang.cheng@vip.163.com>",
]
edition = "2018"
rust-version = "1.94"
license = "Apache-2.0"
description = "SQLx adapter for Apache Casbin (Incubating)"
homepage = "https://casbin.apache.org"
repository = "https://github.com/apache/casbin-sqlx-adapter"
readme = "README.md"
# Exclude test databases even when packaging an extracted source archive.
exclude = ["*.db", "*.db-wal", "*.db-shm"]

[dependencies]
casbin = { version = "2.1.0", default-features = false }
sqlx = { version = "0.9", default-features = false, features = ["macros"] }
async-trait = "0.1.51"

[features]
default = ["postgres", "runtime-tokio-native-tls"]

#databases
postgres = ["sqlx/postgres"]
mysql = ["sqlx/mysql"]
sqlite = ["sqlx/sqlite"]

# async runtime
# async-std
runtime-async-std = ["casbin/runtime-async-std", "sqlx/runtime-async-std"]
runtime-tokio = ["casbin/runtime-tokio", "sqlx/runtime-tokio"]

# TLS
tls-native-tls = ["sqlx/tls-native-tls"]
tls-rustls = ["sqlx/tls-rustls"]

# Backward-compatible runtime/TLS aliases
runtime-async-std-native-tls = ["runtime-async-std", "tls-native-tls"]
runtime-async-std-rustls = ["runtime-async-std", "tls-rustls"]
runtime-tokio-native-tls = ["runtime-tokio", "tls-native-tls"]
runtime-tokio-rustls = ["runtime-tokio", "tls-rustls"]

[dev-dependencies]
async-std = { version = "1.9.0", features = ["attributes"] }
tokio = { version = "1.10.0", features = ["full"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3

[profile.dev]
split-debuginfo = "packed"
