name: Release

# RC tags create unsigned candidate archives. Final tags reuse the voted,
# signed ASF originals after promotion, then publish convenience packages.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  github-release:
    if: github.repository == 'apache/casbin-sqlx-adapter'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      is_rc: ${{ steps.meta.outputs.is_rc }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify tag and committed version
        id: meta
        run: python3 .github/scripts/release_meta.py
      - name: Create RC source archive
        if: steps.meta.outputs.is_rc == 'true'
        env:
          BASENAME: ${{ steps.meta.outputs.basename }}
        run: |
          set -euo pipefail
          mkdir dist
          git archive --format=tar.gz --prefix="${BASENAME}/" -o "dist/${BASENAME}.tar.gz" HEAD
          cd dist
          sha512sum "${BASENAME}.tar.gz" > "${BASENAME}.tar.gz.sha512"
      - name: Verify and reuse promoted ASF originals
        if: steps.meta.outputs.is_rc == 'false'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: python3 .github/scripts/verify_release.py "$VERSION"
      - name: Prepare release notes
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          IS_RC: ${{ steps.meta.outputs.is_rc }}
        run: |
          if [ "$IS_RC" = true ]; then
            echo "Candidate for SQLx Adapter $VERSION. Not an official Apache release. Sign and stage the source archive for the applicable Apache votes." > release-notes.md
          else
            echo "SQLx Adapter $VERSION. Source files are the verified originals promoted to ASF distribution after the applicable votes." > release-notes.md
            printf '\nOfficial source: https://downloads.apache.org/incubator/casbin/sqlx-adapter-%s-incubating/\n' "$VERSION" >> release-notes.md
            printf '\nVerify downloads: https://www.apache.org/info/verification.html\n' >> release-notes.md
          fi
          printf '\n' >> release-notes.md
          cat DISCLAIMER >> release-notes.md
      - name: Create GitHub release without replacing existing assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          IS_RC: ${{ steps.meta.outputs.is_rc }}
        run: |
          set -euo pipefail
          FLAGS=()
          if [ "$IS_RC" = true ]; then FLAGS+=(--prerelease --latest=false); fi
          gh release create "$TAG" dist/* --verify-tag --title "$TAG" --notes-file release-notes.md "${FLAGS[@]}"

  publish:
    needs: github-release
    if: needs.github-release.outputs.is_rc == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify final tag and version
        run: python3 .github/scripts/release_meta.py
      - name: Verify ASF originals before loading publication credentials
        env:
          VERSION: ${{ needs.github-release.outputs.version }}
        run: python3 .github/scripts/verify_release.py "$VERSION" --output verified-release
      - name: Install Rust toolchain
        run: rustup update stable --no-self-update
      - name: Publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          SQLX_OFFLINE: true
        run: cargo +stable publish
